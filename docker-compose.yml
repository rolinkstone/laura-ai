# ============================================================
# LAURA AI — Production Compose (deploy ke server)
# ------------------------------------------------------------
# Semua nilai sensitif diambil dari file `.env` (TIDAK di-commit).
#   cp .env.example .env   lalu isi nilainya.
#
# Validasi tanpa menjalankan: docker compose config --quiet
#
# Database TIDAK dibuat oleh compose ini. Compose memakai container
# PostgreSQL yang sudah berjalan di server:
#     postgresql_5jhh-postgresql_5JhH-1   (host port 5432)
# Backend berjalan dengan network_mode: host, jadi DB_HOST default = 127.0.0.1.
# ============================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: laura-ai-backend:latest
    container_name: laura-backend
    restart: unless-stopped
    # Backend bergabung ke network Docker milik container PostgreSQL, sehingga
    # Docker embedded DNS aktif dan DB_HOST boleh memakai NAMA CONTAINER:
    #   postgresql_5jhh-postgresql_5JhH-1
    # Nama network diambil dari .env (POSTGRES_NETWORK).
    networks:
      - pgnet
    # Hanya di-bind ke loopback host — akses dari luar lewat nginx (HTTPS)
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5005}:${BACKEND_PORT:-5005}"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-5005}
      # 0.0.0.0 karena backend ada di network bridge (bukan network_mode: host)
      HOST: ${BACKEND_HOST:-0.0.0.0}

      # ---- Database ----
      # Nama container postgres — resolveable karena senetwork (pgnet)
      DB_HOST: ${DB_HOST:-postgresql_5jhh-postgresql_5JhH-1}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      # ---- Auth ----
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}

      # ---- CORS: hanya domain frontend ----
      CORS_ORIGIN: ${PUBLIC_FRONTEND_URL}

      # ---- Reverse proxy (nginx) ----
      # Percaya 1 hop proxy agar X-Forwarded-For / IP pengguna terbaca benar
      # oleh express-rate-limit. Isi 0 bila tidak memakai reverse proxy.
      TRUST_PROXY: ${TRUST_PROXY:-1}

      # ---- Embedding / RAG ----
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Xenova/multilingual-e5-small}
      SEARCH_MIN_SCORE: ${SEARCH_MIN_SCORE:-0.15}
      SEARCH_RESULT_LIMIT: ${SEARCH_RESULT_LIMIT:-5}

      # ---- AI / LLM ----
      AI_PROVIDER: ${AI_PROVIDER:-ninerouter}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY}
      NINEROUTER_MODEL: ${NINEROUTER_MODEL:-gemini-3.6-flash}
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL:-https://router.bbpompky.id/v1}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}

      # ---- Web scraper ----
      WEB_ALLOW_INSECURE_TLS: ${WEB_ALLOW_INSECURE_TLS:-false}

      # ---- AI Agent (pipeline LAURA) ----
      # PLANNER -> RAG + WEB SEARCH -> SOURCE SELECTION -> RERANKER -> LLM
      # -> jawaban + CITATION/SOURCE (lihat backend/docs/agent-pipeline.md)
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      AGENT_PLANNER_ENABLED: ${AGENT_PLANNER_ENABLED:-true}
      AGENT_RERANK_ENABLED: ${AGENT_RERANK_ENABLED:-true}
      AGENT_RERANK_LLM: ${AGENT_RERANK_LLM:-true}
      AGENT_TOP_K: ${AGENT_TOP_K:-5}
      AGENT_RAG_CANDIDATES: ${AGENT_RAG_CANDIDATES:-12}
      # Dokumen dashboard selalu ikut dicari + jaminan sumber dokumen di jawaban
      AGENT_ALWAYS_USE_RAG: ${AGENT_ALWAYS_USE_RAG:-true}
      AGENT_MIN_RAG_SOURCES: ${AGENT_MIN_RAG_SOURCES:-2}
      AGENT_MIN_RAG_SCORE: ${AGENT_MIN_RAG_SCORE:-0.2}
      # Kualitas sumber: di bawah ambang ini sumber dianggap lemah
      AGENT_MIN_TOP_SCORE: ${AGENT_MIN_TOP_SCORE:-0.35}
      AGENT_ESCALATE_ON_WEAK: ${AGENT_ESCALATE_ON_WEAK:-true}
      AGENT_W_VECTOR: ${AGENT_W_VECTOR:-0.35}
      AGENT_W_LEXICAL: ${AGENT_W_LEXICAL:-0.25}
      AGENT_W_LLM: ${AGENT_W_LLM:-0.4}
      CITATION_ENABLED: ${CITATION_ENABLED:-true}
      CITATION_APPEND_LIST: ${CITATION_APPEND_LIST:-true}

      # ---- Web Search (situs resmi) ----
      AGENT_WEB_SEARCH_ENABLED: ${AGENT_WEB_SEARCH_ENABLED:-true}
      # auto | tavily | brave | serpapi | duckduckgo | internal | off
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-auto}
      WEB_SEARCH_FALLBACK_INTERNAL: ${WEB_SEARCH_FALLBACK_INTERNAL:-true}
      WEB_SEARCH_OFFICIAL_ONLY: ${WEB_SEARCH_OFFICIAL_ONLY:-true}
      WEB_SEARCH_FETCH_TOP: ${WEB_SEARCH_FETCH_TOP:-3}
      WEB_SEARCH_CONTENT_CHARS: ${WEB_SEARCH_CONTENT_CHARS:-2500}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      WEB_SEARCH_ALLOWED_DOMAINS: ${WEB_SEARCH_ALLOWED_DOMAINS:-}
      # true = izinkan SEMUA *.go.id (mis. peraturan.bpk.go.id). Default false.
      WEB_SEARCH_ALLOW_GOID_SUFFIX: ${WEB_SEARCH_ALLOW_GOID_SUFFIX:-false}
      WEB_SEARCH_ALLOWED_SUFFIXES: ${WEB_SEARCH_ALLOWED_SUFFIXES:-}
      WEB_SEARCH_INDEX_URLS: ${WEB_SEARCH_INDEX_URLS:-}

      # ---- Keycloak ----
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-master}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-laura-ai}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
    volumes:
      # Dokumen PDF hasil upload
      - ./data/backend/uploads:/usr/src/app/uploads
      # Cache model embedding (transformers.js) — agar tidak unduh ulang
      - ./data/backend/.cache:/usr/src/app/.cache
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||5005)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* di-inline saat BUILD, jadi wajib dikirim sebagai build arg
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_BACKEND_URL}/api
        NEXT_PUBLIC_KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-laura-ai}
    image: laura-ai-frontend:latest
    container_name: laura-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3006}:${FRONTEND_PORT:-3006}"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      NODE_ENV: production
      PORT: ${FRONTEND_PORT:-3006}
      HOSTNAME: 0.0.0.0

      # ---- API backend (dipakai browser & server-side) ----
      NEXT_PUBLIC_API_URL: ${PUBLIC_BACKEND_URL}/api

      # ---- Keycloak SSO ----
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-laura-ai}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      NEXT_PUBLIC_KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-laura-ai}

      # ---- NextAuth ----
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_URL_INTERNAL: http://127.0.0.1:${FRONTEND_PORT:-3006}
      NEXTAUTH_TRUST_HOST: "true"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      - backend

networks:
  # Network Docker milik container PostgreSQL — dipakai bersama oleh backend
  # supaya nama container bisa di-resolve (Docker embedded DNS).
  pgnet:
    external: true
    name: ${POSTGRES_NETWORK:?POSTGRES_NETWORK belum diisi di .env — lihat DEPLOY.md}